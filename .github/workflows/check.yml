name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck tmux
      - name: Check scripts and behaviour
        run: |
          bash -n fleet tests/run.sh
          shellcheck fleet tests/run.sh
          bash tests/run.sh
